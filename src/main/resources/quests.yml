# Wird automatisch (ohne manuelles Abholen) gutgeschrieben, sobald ALLE
# Quests der jeweiligen Kategorie in der aktuellen Periode fertig sind.
category-bonus:
  daily:
    tokens: 200
    gold: 0
  weekly:
    tokens: 1000
    gold: 10
  monthly:
    tokens: 5000
    gold: 50

# Bonus fuer aufeinanderfolgende Tage, an denen die Daily-Quest(s) komplett
# geschafft wurden. Schluessel = Streak-Laenge in Tagen. Beliebig viele
# Stufen moeglich, nicht erreichte Stufen werden einfach uebersprungen.
streak-bonuses:
  7:
    tokens: 2000
    gold: 0
  30:
    tokens: 10000
    gold: 50
