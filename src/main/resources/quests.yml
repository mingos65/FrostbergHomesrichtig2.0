# =====================================================
#         FrostbergHomes - Quest-System: quests.yml
# =====================================================
# Hier legst du fest, welche Quests im Pool jeder Kategorie zur Auswahl
# stehen. Bei jedem Reset (taeglich/woechentlich/monatlich) wuerfelt der
# Server "quest-count" Quests aus dem jeweiligen Pool - fuer ALLE Spieler
# gleich, nicht zufaellig pro Spieler. Aenderungen werden mit /quest reload
# uebernommen (wirkt sich erst auf die naechste Auswahl aus, laufende
# Perioden werden nicht abgebrochen - der Fortschritt bereits aktiver Quests
# bleibt aber bestehen und ihre Zahlen aktualisieren sich sofort, wenn du
# die ID unveraendert laesst und nur amount/reward/difficulty aenderst).
#
# Richtwerte fuer die Mengen (amount): Taeglich sollte in ein paar Minuten
# machbar sein, Woechentlich etwas mehr Aufwand ueber die Woche verteilt,
# Monatlich spuerbar schwerer aber ueber 30 Tage trotzdem entspannt machbar.
#
# WICHTIG - Belohnungs-Logik: Die Belohnung haengt NUR von "difficulty"
# (1-5 Sterne) und der Kategorie ab, nicht vom Quest-Typ - zwei Quests mit
# gleicher Sternezahl in derselben Kategorie geben also immer die gleiche
# Tokens-Zahl. Das verhindert Unsinn wie "150 Stein = 150 Tokens, aber
# 500 Stein = 400 Tokens nur weil es eine andere Quest ist". Richtwerte,
# an die sich alle Quests unten halten:
#
#   Taeglich:   1*=140  2*=190  3*=250  4*=320  5*=400   Tokens
#   Woechentl.: 1*=400  2*=550  3*=700  4*=900  5*=1150  Tokens (+ Gold bei 4-5*)
#   Monatlich:  1*=1200 2*=1600 3*=2100 4*=2700 5*=3400  Tokens (+ Gold bei 4-5*)
#
# Wenn du eine neue Quest hinzufuegst: ueberlege realistisch, wie viel
# Aufwand/Zeit/Risiko sie im Vergleich zu den anderen ihrer Kategorie
# braucht, vergib die passende Sternezahl und nimm die Tokens-Zahl aus der
# Tabelle oben - nicht frei erfinden.
#
# Ein Quest-Eintrag sieht so aus:
#
#   - id: "eindeutiger_name"        # frei waehlbar, muss innerhalb der
#                                    # Kategorie einmalig sein
#     type: MINE_BLOCK              # siehe Liste unten
#     target: STONE                 # Material-/Entity-Name oder Tag-Keyword,
#                                    # bei EARN_TOKENS und WALK_DISTANCE weglassen
#     amount: 200                   # wie oft/wie viel insgesamt noetig ist
#     name: "Baue 200 Stein ab"     # Anzeigename im GUI (faerbbar mit &)
#     description: "Baue 200 Stein-Bloecke in der Farmwelt ab."
#     difficulty: 2                 # 1-5 Sterne - siehe Tabelle oben fuer die Belohnung
#     reward:
#       tokens: 550
#       gold: 0
#
# Verfuegbare "type"-Werte und was bei "target" erlaubt ist:
#   MINE_BLOCK     - target: exakter Material-Name (z.B. STONE, OAK_LOG) oder
#                    Tag-Keyword: LOGS/PLANKS/LEAVES/WOOL/SAPLINGS/
#                    COAL_ORES/IRON_ORES/GOLD_ORES/REDSTONE_ORES/LAPIS_ORES/COPPER_ORES
#                    (Tags fassen z.B. normales + Deepslate-Erz zusammen)
#   PLACE_BLOCK    - target: wie MINE_BLOCK (z.B. TURTLE_EGG, SAPLINGS)
#   KILL_ENTITY    - target: exakter Entity-Name (z.B. ZOMBIE, SKELETON)
#   CRAFT_ITEM     - target: exaktes Ergebnis-Material oder Tag (z.B. BREAD, PLANKS)
#   FISH           - target: optional, sonst zaehlt jeder Fang
#   WALK_DISTANCE  - kein target noetig, amount = Bloecke in der Farmwelt
#   EARN_TOKENS    - kein target noetig, amount = verdiente Tokens (egal woher)
#
# WICHTIG: Fortschritt zaehlt bei ALLEN Quest-Typen nur in der Farmwelt
# (siehe settings.farm-world in config.yml).

