# Kategorie-Bonus: erscheint als eigenes Item im jeweiligen Kategorie-GUI
# (direkt ueber dem Hilfe-Buch), grau/gesperrt solange nicht ALLE Quests
# dieser Kategorie fertig sind, gruen und anklickbar sobald alle fertig
# sind. Muss wie jede andere Belohnung manuell im GUI abgeholt werden
# (siehe QuestManager#claimCategoryBonus).
category-bonus:
  daily:
    tokens: 250
    gold: 0
  weekly:
    tokens: 1200
    gold: 15
  monthly:
    tokens: 6000
    gold: 60

# Bonus fuer aufeinanderfolgende Tage, an denen die Daily-Quest(s) komplett
# geschafft wurden. Schluessel = Streak-Laenge in Tagen. Beliebig viele
# Stufen moeglich, nicht erreichte Stufen werden einfach uebersprungen.
streak-bonuses:
  7:
    tokens: 2000
    gold: 0
  30:
    tokens: 10000
    gold: 50
