        gold: 0
    - id: "daily_kill_zombies"
      type: KILL_ENTITY
      target: ZOMBIE
      amount: 20
      name: "Töte 20 Zombies"
      description: "Besiege 20 Zombies in der Farmwelt."
      difficulty: 2
      reward:
        tokens: 250
        gold: 0
    - id: "daily_mine_stone"
      type: MINE_BLOCK
      target: STONE
      amount: 150
      name: "Baue 150 Stein ab"
      description: "Baue 150 Stein-Blöcke in der Farmwelt ab."
      difficulty: 1
      reward:
        tokens: 150
        gold: 0
    - id: "daily_craft_bread"
      type: CRAFT_ITEM
      target: BREAD
      amount: 32
      name: "Craft 32 Brote"
      description: "Stelle 32 Brote her."
      difficulty: 1
      reward:
        tokens: 150
        gold: 0
    - id: "daily_walk"
      type: WALK_DISTANCE
      amount: 800
      name: "Laufe 800 Blöcke"
      description: "Laufe 800 Blöcke in der Farmwelt."
      difficulty: 1
      reward:
        tokens: 150
        gold: 0

