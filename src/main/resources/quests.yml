# Kategorie-Bonus: erscheint als eigenes Item im jeweiligen Kategorie-GUI
# (direkt ueber dem Hilfe-Buch), grau/gesperrt solange nicht ALLE Quests
# dieser Kategorie fertig sind, gruen und anklickbar sobald alle fertig
# sind. Muss wie jede andere Belohnung manuell im GUI abgeholt werden
# (siehe QuestManager#claimCategoryBonus). Gold nach derselben Regel wie
# oben (1 Gold = 1.000 Tokens). KEIN Eintrag fuer "daily" - bei nur 1
# aktiver Quest pro Tag waere "alle Quests fertig" exakt derselbe Moment
# wie das Abholen der einzigen Quest selbst, das GUI zeigt dort bewusst
# gar kein Bonus-Item an (siehe QuestGuiListener#openCategory).
category-bonus:
  weekly:
    tokens: 4000
    gold: 4
  monthly:
    tokens: 20000
    gold: 20

# Bonus fuer aufeinanderfolgende Tage, an denen die Daily-Quest(s) komplett
# geschafft wurden. Schluessel = Streak-Laenge in Tagen. Beliebig viele
# Stufen moeglich, nicht erreichte Stufen werden einfach uebersprungen.
# Gold ebenfalls nach der 1-Gold-=-1.000-Tokens-Regel.
streak-bonuses:
  7:
    tokens: 8000
    gold: 8
  30:
    tokens: 40000
    gold: 40
