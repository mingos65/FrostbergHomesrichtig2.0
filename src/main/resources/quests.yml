# =====================================================
#         FrostbergHomes - Quest-System: quests.yml
# =====================================================
# Hier legst du fest, welche Quests im Pool jeder Kategorie zur Auswahl
# stehen. Bei jedem Reset (taeglich/woechentlich/monatlich) wuerfelt der
# Server "quest-count" Quests aus dem jeweiligen Pool - fuer ALLE Spieler
# gleich, nicht zufaellig pro Spieler. Aenderungen werden mit /quest reload
# uebernommen (wirkt sich erst auf die naechste Auswahl aus, laufende
# Perioden werden nicht abgebrochen).
#
# Ein Quest-Eintrag sieht so aus:
#
#   - id: "eindeutiger_name"        # frei waehlbar, muss innerhalb der
#                                    # Kategorie einmalig sein
#     type: MINE_BLOCK              # siehe Liste unten
#     target: STONE                 # Material-/Entity-Name oder Tag-Keyword,
#                                    # bei EARN_TOKENS und WALK_DISTANCE weglassen
#     amount: 200                   # wie oft/wie viel insgesamt noetig ist
#     name: "Baue 200 Stein ab"     # Anzeigename im GUI (faerbbar mit &)
#     description: "Baue 200 Stein-Bloecke in der Farmwelt ab."
#     difficulty: 2                 # 1-5 Sterne im GUI
#     reward:
#       tokens: 600
#       gold: 0
#
# Verfuegbare "type"-Werte und was bei "target" erlaubt ist:
#   MINE_BLOCK     - target: exakter Material-Name (z.B. STONE, OAK_LOG)
#                    oder eines der Tag-Keywords LOGS/PLANKS/LEAVES/WOOL/SAPLINGS
#   PLACE_BLOCK    - target: wie MINE_BLOCK (z.B. TURTLE_EGG)
#   KILL_ENTITY    - target: exakter Entity-Name (z.B. ZOMBIE, SKELETON)
#   CRAFT_ITEM     - target: exaktes Ergebnis-Material (z.B. BREAD)
#   FISH           - target: optional, sonst zaehlt jeder Fang
#   WALK_DISTANCE  - kein target noetig, amount = Bloecke in der Farmwelt
#   EARN_TOKENS    - kein target noetig, amount = verdiente Tokens (egal woher)
#
# WICHTIG: Fortschritt zaehlt bei ALLEN Quest-Typen nur in der Farmwelt
# (siehe settings.farm-world in config.yml).

daily:
  quest-count: 1
  pool:
    - id: "daily_turtle_eggs"
      type: PLACE_BLOCK
      target: TURTLE_EGG
      amount: 2
      name: "Platziere 2 Schildkröteneier"
      description: "Platziere 2 Schildkröteneier in der Farmwelt."
      difficulty: 1
      reward:
        tokens: 150
        gold: 0
