name: FrostbergHomes
version: '${project.version}'
main: de.frostberg.homes.FrostbergHomes
api-version: '1.21'
author: Frostberg
description: Eigenes Homes-Plugin fuer Paper - farbenfroh, konfigurierbar, kein Essentials noetig.

# Laedt NACH diesen Plugins, falls vorhanden - keine Pflicht-Abhaengigkeit
softdepend: [LuckPerms, Vault, PlaceholderAPI, PlotSquared, Multiverse-Core, TAB, PlayerPoints, EssentialEconomy]

# Muss VOR EssentialEconomy laden, damit unser eigener /pay-Befehl den Namen
# bekommt (EssentialEconomy hat selbst keine Moeglichkeit, seinen /pay-Befehl
# umzubenennen - siehe PayCommand.java fuer Details)
loadbefore: [EssentialEconomy]

commands:
  set:
    description: 'Setzt ein Home (Nutzung: /set home [nr])'
    usage: /set home [nr]
    permission: homes.set
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  delete:
    description: 'Loescht ein Home (Nutzung: /delete home [nr])'
    usage: /delete home [nr]
    permission: homes.delete
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  sethome:
    description: 'Setzt ein Home mit Namen (Nutzung: /sethome <name>)'
    usage: /sethome <name>
    permission: homes.set
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  delhome:
    description: 'Loescht ein Home anhand seines Namens (Nutzung: /delhome <name>)'
    usage: /delhome <name>
    permission: homes.delete
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  home:
    description: Teleportiert dich zu einem Home
    usage: /home [nr]
    permission: homes.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  homes:
    description: Zeigt alle deine Homes an
    usage: /homes [reload]
    permission: homes.list
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  pay:
    description: 'Sendet Tokens oder Gold an einen anderen Spieler (Nutzung: /pay <tokens|gold> <spieler> <anzahl>)'
    usage: /pay <tokens|gold> <spieler> <anzahl>
    permission: frostberg.pay.tokens
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  tpa:
    description: 'Fragt einen Spieler, ob du dich zu ihm teleportieren darfst (Nutzung: /tpa <spieler>)'
    usage: /tpa <spieler>
    permission: tpa.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  tpahere:
    description: 'Fragt einen Spieler, ob er sich zu dir teleportieren soll (Nutzung: /tpahere <spieler>)'
    usage: /tpahere <spieler>
    permission: tpa.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  tpaccept:
    description: Nimmt eine offene Teleport-Anfrage an
    usage: /tpaccept
    permission: tpa.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  tpdeny:
    description: Lehnt eine offene Teleport-Anfrage ab
    usage: /tpdeny
    permission: tpa.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  tp:
    description: 'Teleportiert dich sofort zu einem Spieler, ohne Anfrage (Nutzung: /tp <spieler>)'
    usage: /tp <spieler>
    permission: tpa.admin
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  tphere:
    description: 'Teleportiert einen Spieler sofort zu dir, ohne Anfrage (Nutzung: /tphere <spieler>)'
    usage: /tphere <spieler>
    permission: tpa.admin
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  spawn:
    description: Teleportiert dich zum Server-Spawn
    usage: /spawn
    permission: spawn.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  farmwelt:
    description: Teleportiert dich zur Farmwelt
    usage: /farmwelt
    permission: spawn.use
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  setspawn:
    description: Setzt den Spawnpunkt der Hauptwelt auf deine Position
    usage: /setspawn
    permission: spawn.admin
    permission-message: '&cDu hast keine Berechtigung dafuer.'
  setfarmwelt:
    description: Setzt den Spawnpunkt der Farmwelt auf deine Position
    usage: /setfarmwelt
    permission: spawn.admin
    permission-message: '&cDu hast keine Berechtigung dafuer.'

permissions:
  homes.*:
    description: Gibt Zugriff auf alle Homes-Funktionen
    default: false
    children:
      homes.set: true
      homes.use: true
      homes.delete: true
      homes.list: true
      homes.reload: true
      homes.bypass.cooldown: true
      homes.bypass.warmup: true
      homes.limit.unlimited: true

  homes.set:
    description: Erlaubt das Setzen von Homes
    default: true
  homes.use:
    description: Erlaubt das Teleportieren zu Homes
    default: true
  homes.delete:
    description: Erlaubt das Loeschen von Homes
    default: true
  homes.list:
    description: Erlaubt das Anzeigen der Homes-Liste
    default: true
  homes.reload:
    description: Erlaubt das Neuladen der Config (/homes reload)
    default: op

  homes.bypass.cooldown:
    description: Umgeht den Cooldown zwischen Teleports
    default: op
  homes.bypass.warmup:
    description: Umgeht den Warmup/Countdown vor dem Teleport
    default: op

  homes.limit.1:
    description: Erlaubt 1 Home
    default: false
  homes.limit.2:
    description: Erlaubt 2 Homes
    default: false
  homes.limit.3:
    description: Erlaubt 3 Homes
    default: false
  homes.limit.4:
    description: Erlaubt 4 Homes
    default: false
  homes.limit.5:
    description: Erlaubt 5 Homes
    default: false
  homes.limit.6:
    description: Erlaubt 6 Homes
    default: false
  homes.limit.7:
    description: Erlaubt 7 Homes
    default: false
  homes.limit.8:
    description: Erlaubt 8 Homes
    default: false
  homes.limit.9:
    description: Erlaubt 9 Homes
    default: false
  homes.limit.10:
    description: Erlaubt 10 Homes
    default: false
  homes.limit.11:
    description: Erlaubt 11 Homes
    default: false
  homes.limit.12:
    description: Erlaubt 12 Homes
    default: false
  homes.limit.13:
    description: Erlaubt 13 Homes
    default: false
  homes.limit.14:
    description: Erlaubt 14 Homes (alle Slots auf Seite 1 im /homes-GUI)
    default: false
  homes.limit.15:
    description: Erlaubt 15 Homes
    default: false
  homes.limit.16:
    description: Erlaubt 16 Homes
    default: false
  homes.limit.17:
    description: Erlaubt 17 Homes
    default: false
  homes.limit.18:
    description: Erlaubt 18 Homes
    default: false
  homes.limit.19:
    description: Erlaubt 19 Homes
    default: false
  homes.limit.20:
    description: Erlaubt 20 Homes
    default: false
  homes.limit.21:
    description: Erlaubt 21 Homes
    default: false
  homes.limit.22:
    description: Erlaubt 22 Homes
    default: false
  homes.limit.23:
    description: Erlaubt 23 Homes
    default: false
  homes.limit.24:
    description: Erlaubt 24 Homes
    default: false
  homes.limit.25:
    description: Erlaubt 25 Homes
    default: false
  homes.limit.26:
    description: Erlaubt 26 Homes
    default: false
  homes.limit.27:
    description: Erlaubt 27 Homes
    default: false
  homes.limit.28:
    description: Erlaubt 28 Homes (Maximum, alle Slots auf beiden Seiten im /homes-GUI)
    default: false
  homes.limit.unlimited:
    description: Erlaubt unbegrenzt viele Homes
    default: false

  frostberg.pay.tokens:
    description: Erlaubt das Senden von Tokens per /pay tokens
    default: true

  tpa.*:
    description: Gibt Zugriff auf alle TPA-Funktionen inkl. Admin-Teleport
    default: false
    children:
      tpa.use: true
      tpa.admin: true
      tpa.bypass.cooldown: true
      tpa.bypass.warmup: true

  tpa.use:
    description: Erlaubt /tpa, /tpahere, /tpaccept und /tpdeny
    default: true
  tpa.admin:
    description: Erlaubt sofortigen Teleport ohne Anfrage (/tp, /tphere)
    default: op
  tpa.bypass.cooldown:
    description: Umgeht den Cooldown zwischen TPA-Teleports
    default: op
  tpa.bypass.warmup:
    description: Umgeht den Warmup/Countdown vor dem TPA-Teleport
    default: op

  spawn.*:
    description: Gibt Zugriff auf alle Spawn-Funktionen
    default: false
    children:
      spawn.use: true
      spawn.admin: true

  spawn.use:
    description: Erlaubt /spawn und /farmwelt
    default: true
  spawn.admin:
    description: Erlaubt /setspawn und /setfarmwelt
    default: op
