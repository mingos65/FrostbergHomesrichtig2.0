# =====================================================
#                FrostbergHomes - Config
#  Alle Chat-/GUI-Texte stehen in der separaten messages.yml
# =====================================================
settings:
  # Cooldown zwischen zwei Home-Teleports in Sekunden. 0 = deaktiviert
  cooldown-seconds: 30
  # Warmup / Countdown vor dem Teleport in Sekunden. 0 = sofortiger Teleport
  # Gilt sowohl fuer /home als auch fuer /tpa und /tpahere (nach Annahme)
  warmup-seconds: 3
  # Bricht der Warmup ab, sobald sich der Spieler bewegt (nicht nur umschaut)?
  cancel-warmup-on-move: true
  # Zeit in Sekunden, nach der eine unbeantwortete /tpa- bzw. /tpahere-Anfrage automatisch abläuft
  tpa-expiry-seconds: 60
  # Sicherer Teleport: sucht eine sichere Position, falls das Home z.B.
  # in Lava, Luft über einem Abgrund oder in einem Block liegt
  safe-teleport: true
  # Home-Limit, falls der Spieler keine homes.limit.<n> / homes.limit.unlimited
  # Permission von LuckPerms besitzt (Fallback)
  default-home-limit: 1
  # Welt, zu der /spawn und /setspawn gehören (aktuell wird der Spawn in der
  # Plotwelt gebaut, nicht in der Hauptwelt "world")
  spawn-world: "plotwelt65"
  # Welt, zu der /farmwelt und /setfarmwelt gehören
  farm-world: "farm"
  # Maximaler Radius in Blöcken um den mit /setfarmwelt gesetzten Mittelpunkt,
  # innerhalb dessen /farmwelt eine zufällige, sichere Position auswählt
  farm-teleport-radius: 4000
  # Mindestabstand in Blöcken vom Mittelpunkt - verhindert, dass Spieler direkt
  # neben dem Zentrum (und damit evtl. schon abgebauten Flächen) landen
  farm-teleport-min-radius: 2000
effects:
  # Sound beim Start des Countdowns
  sound-on-warmup-start: true
  sound-warmup: "BLOCK_NOTE_BLOCK_PLING"
  sound-warmup-volume: 1.0
  sound-warmup-pitch: 1.0
  # Sound bei erfolgreichem Teleport
  sound-on-teleport: true
  sound-teleport: "ENTITY_ENDERMAN_TELEPORT"
  sound-teleport-volume: 1.0
  sound-teleport-pitch: 1.0
  # Partikel am Zielort beim Teleport
  particles-on-teleport: true
  particle-teleport: "PORTAL"
  particle-amount: 40
  # Kurzer Title beim Ankommen, z.B. "Home 2"
  title-on-teleport: false
  title-fade-in: 5
  title-stay: 30
  title-fade-out: 10
clan:
  # Maximale Mitgliederzahl pro Clan
  max-members: 20
  # Erlaubte Länge des Clan-Tags (z.B. "FBM"), in Zeichen
  tag-min-length: 2
  tag-max-length: 6
  # Zeit in Sekunden, nach der eine unbeantwortete Clan-Einladung automatisch abläuft
  invite-expiry-seconds: 60
  # Wörter, die weder im Clan-Namen noch im Tag vorkommen dürfen (Kleinschreibung wird ignoriert)
  blocked-words:
    - "admin"
    - "mod"
    - "owner"
  # Farben, die ein Clan sich per /clan color mit Gold kaufen kann (Leader/Mod).
  # code: normaler Farbcode ("&c"), Hexcode ("&#RRGGBB") oder Verlauf
  # ("gradient:RRGGBB:RRGGBB") - siehe util/ColorUtil.
  colors:
    - name: "Aqua"
      code: "&b"
      price: 0
    - name: "Rot"
      code: "&c"
      price: 500
    - name: "Gruen"
      code: "&a"
      price: 500
    - name: "Gold"
      code: "&6"
      price: 750
    - name: "Lila"
      code: "&5"
      price: 750
    - name: "Pink"
      code: "&#FF55FF"
      price: 1500
    - name: "Feuer-Verlauf"
      code: "gradient:FF4500:FFD700"
      price: 2000
quest:
  # Fortschritt zaehlt nur in der Welt aus settings.farm-world (siehe oben) -
  # keine eigene Welt-Einstellung noetig, das ist bewusst dieselbe Welt.
  progress-messages-enabled: true
  # Alle wie viele erledigte Einheiten eine Zwischen-Nachricht kommt (z.B.
  # alle 100 abgebaute Bloecke). 0 deaktiviert die Zwischen-Nachrichten komplett.
  progress-message-interval: 100
  join-reminder-enabled: true
  repeat-reminder-enabled: true
  repeat-reminder-interval-minutes: 30
  # Wie oft (Sekunden) der Tokens-Kontostand fuer "Verdiene X Tokens"-Quests
  # geprueft wird (per PlaceholderAPI, keine eigene PlayerPoints-Abhaengigkeit)
  token-balance-check-interval-seconds: 5
  # Nachricht an alle Online-Spieler, wenn eine neue Periode startet
  reset-broadcast-enabled: true
  # Rang-Multiplikator fuer Quest-Belohnungen (Tokens/Gold). Der hoechste
  # zutreffende Multiplikator gewinnt, Spieler ohne passende Permission
  # bekommen die normale (1x) Belohnung. Die Permissions vergibst du selbst
  # ueber LuckPerms an die gewuenschten Raenge.
  reward-multipliers:
    - permission: "quest.multiplier.vip"
      multiplier: 1.25
    - permission: "quest.multiplier.premium"
      multiplier: 1.5
  effects:
    sound-on-complete: true
    sound-complete: "ENTITY_PLAYER_LEVELUP"
    particles-on-complete: true
    particle-complete: "HAPPY_VILLAGER"
    sound-on-claim: true
    sound-claim: "ENTITY_EXPERIENCE_ORB_PICKUP"
